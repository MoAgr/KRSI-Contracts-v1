[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# One exact compiler for everything (SPEC 3.4, DEVIATIONS D7).
solc = "0.8.28"
evm_version = "cancun"
auto_detect_solc = false
# KrsiReceipt is 30,046 bytes unoptimized; approved by the contracts lead in Phase 2 (see PHASE_LOG.md). No via_ir.
optimizer = true
optimizer_runs = 200
# Build output (test_NoPublicBurn), deployments files (Deploy, IssueKyc, RevokeKyc and their tests), vectors.
fs_permissions = [
    { access = "read", path = "./out" },
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "./handoff/vectors.json" },
]
# Our code and EAS both resolve OpenZeppelin to the single 5.7.0 copy.
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@ethereum-attestation-service/eas-contracts/=lib/eas-contracts/",
    "forge-std/=lib/forge-std/src/",
]

# Kept small so `forge test` stays quick; `FOUNDRY_PROFILE=deep forge test` runs the thorough version.
[invariant]
runs = 32
depth = 64

[profile.deep.fuzz]
runs = 5000

[profile.deep.invariant]
runs = 256
depth = 500
